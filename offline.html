<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#059669">
  <title>You're offline | SpendNote</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .box { max-width: 340px; }
    img { width: 64px; height: 64px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #475569; margin: 0 0 24px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 28px;
      background: #059669;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/favicon.svg" alt="SpendNote">
    <h1>You're offline</h1>
    <p>SpendNote needs an internet connection. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
